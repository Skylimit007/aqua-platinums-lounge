<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Book a Room - Aqua Platinums Lounge & Grill</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="Book your stay at Aqua Platinums Lounge & Grill" name="description">

    <!-- Favicon -->
    <link href="pictures/favicon.png" rel="icon">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link href="css/style.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #f7f7f7;
            color: #2F303A;
        }

        .booking-section {
            padding: 100px 0;
            min-height: 100vh;
            background:
                linear-gradient(rgba(47, 48, 58, 0.90), rgba(47, 48, 58, 0.90)),
                url("pictures/16.jpg") center center/cover no-repeat;
        }

        .booking-card {
            max-width: 950px;
            margin: auto;
            background: #ffffff;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.25);
        }

        .booking-header {
            background: #2F303A;
            color: #ffffff;
            padding: 35px 40px;
            text-align: center;
        }

        .booking-header h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .booking-header p {
            margin: 0;
            color: #dddddd;
        }

        .orange-text {
            color: #EF5F25;
        }

        .booking-body {
            padding: 40px;
        }

        .form-label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #2F303A;
        }

        .form-control,
        .form-select {
            min-height: 52px;
            border: 1px solid #dddddd;
            border-radius: 8px;
            padding: 12px 15px;
            font-size: 14px;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #EF5F25;
            box-shadow: 0 0 0 0.2rem rgba(239, 95, 37, 0.15);
        }

        textarea.form-control {
            min-height: 120px;
            resize: vertical;
        }

        .input-group-text {
            background: #EF5F25;
            border-color: #EF5F25;
            color: #ffffff;
            min-width: 48px;
            justify-content: center;
        }

        .booking-btn {
            background: #EF5F25;
            border: none;
            color: #ffffff;
            padding: 14px 35px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .booking-btn:hover {
            background: #d94f19;
            transform: translateY(-2px);
        }

        .booking-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .back-btn {
            color: #2F303A;
            text-decoration: none;
            font-weight: 500;
        }

        .back-btn:hover {
            color: #EF5F25;
        }

        .required {
            color: #EF5F25;
        }

        #form-status {
            display: none;
            margin-top: 25px;
            padding: 15px 20px;
            border-radius: 8px;
            font-size: 14px;
        }

        #form-status.success {
            display: block;
            background: #dff6e7;
            color: #146c2e;
            border: 1px solid #a9dfba;
        }

        #form-status.error {
            display: block;
            background: #fde2e2;
            color: #9b1c1c;
            border: 1px solid #f2b8b8;
        }

        .booking-info {
            background: #f8f8f8;
            border-left: 4px solid #EF5F25;
            padding: 15px 20px;
            margin-bottom: 30px;
            border-radius: 5px;
        }

        .booking-info i {
            color: #EF5F25;
            margin-right: 8px;
        }

        @media (max-width: 767px) {
            .booking-section {
                padding: 50px 15px;
            }

            .booking-body {
                padding: 25px 20px;
            }

            .booking-header {
                padding: 30px 20px;
            }

            .booking-header h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <section class="booking-section">

        <div class="container">

            <div class="booking-card">

                <!-- Header -->
                <div class="booking-header">

                    <h1>
                        <span class="orange-text">Book</span> Your Stay
                    </h1>

                    <p>
                        Reserve your room at Aqua Platinums Lounge & Grill
                    </p>

                </div>

                <!-- Body -->
                <div class="booking-body">

                    <div class="booking-info">
                        <i class="fas fa-circle-info"></i>
                        Please provide your booking details below. Our team will contact you to confirm availability
                        and finalize your reservation.
                    </div>

                    <!--
                        FORM SUBMIT
                        IMPORTANT:
                        The destination email is aquaplatinums@gmail.com
                    -->

                    <form id="booking-form"
                          class="ajax-booking-form"
                          action="https://formsubmit.co/ajax/aquaplatinums@gmail.com"
                          method="POST">

                        <!-- FormSubmit settings -->
                        <input type="hidden"
                               name="_subject"
                               value="New Room Booking Request - Aqua Platinums Lounge & Grill">

                        <input type="hidden"
                               name="_template"
                               value="table">

                        <!-- Exact page URL -->
                        <input type="hidden"
                               name="_url"
                               value="https://aquaplatinums.com/booking.html">

                        <!-- Guest Information -->
                        <h5 class="mb-4">
                            <i class="fas fa-user orange-text me-2"></i>
                            Guest Information
                        </h5>

                        <div class="row g-4">

                            <!-- Guest Name -->
                            <div class="col-md-6">

                                <label for="guest_name" class="form-label">
                                    Full Name <span class="required">*</span>
                                </label>

                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="fas fa-user"></i>
                                    </span>

                                    <input type="text"
                                           class="form-control"
                                           id="guest_name"
                                           name="guest_name"
                                           placeholder="Enter your full name"
                                           required>
                                </div>

                            </div>

                            <!-- Phone -->
                            <div class="col-md-6">

                                <label for="phone" class="form-label">
                                    Phone Number <span class="required">*</span>
                                </label>

                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="fas fa-phone"></i>
                                    </span>

                                    <input type="tel"
                                           class="form-control"
                                           id="phone"
                                           name="phone"
                                           placeholder="e.g. 0712 345 678"
                                           required>
                                </div>

                            </div>

                            <!-- Email -->
                            <div class="col-md-6">

                                <label for="email" class="form-label">
                                    Email Address <span class="required">*</span>
                                </label>

                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="fas fa-envelope"></i>
                                    </span>

                                    <input type="email"
                                           class="form-control"
                                           id="email"
                                           name="email"
                                           placeholder="your@email.com"
                                           required>
                                </div>

                            </div>

                            <!-- Number of Guests -->
                            <div class="col-md-6">

                                <label for="number_of_guests" class="form-label">
                                    Number of Guests <span class="required">*</span>
                                </label>

                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="fas fa-users"></i>
                                    </span>

                                    <input type="number"
                                           class="form-control"
                                           id="number_of_guests"
                                           name="number_of_guests"
                                           min="1"
                                           max="50"
                                           placeholder="Number of guests"
                                           required>
                                </div>

                            </div>

                        </div>

                        <hr class="my-5">

                        <!-- Room Information -->
                        <h5 class="mb-4">
                            <i class="fas fa-bed orange-text me-2"></i>
                            Room Information
                        </h5>

                        <div class="row g-4">

                            <!-- Room Type -->
                            <div class="col-md-6">

                                <label for="room_type" class="form-label">
                                    Room Type <span class="required">*</span>
                                </label>

                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="fas fa-hotel"></i>
                                    </span>

                                    <select class="form-select"
                                            id="room_type"
                                            name="room_type"
                                            required>

                                        <option value="" selected disabled>
                                            Select room type
                                        </option>

                                        <option value="Studio">
                                            Studio
                                        </option>

                                        <option value="1 Bedroom">
                                            1 Bedroom
                                        </option>

                                        <option value="2 Bedroom">
                                            2 Bedroom
                                        </option>

                                        <option value="3 Bedroom">
                                            3 Bedroom
                                        </option>

                                        <option value="Executive Room">
                                            Executive Room
                                        </option>

                                        <option value="Suite">
                                            Suite
                                        </option>

                                        <option value="Other">
                                            Other
                                        </option>

                                    </select>

                                </div>

                            </div>

                            <!-- Number of Rooms -->
                            <div class="col-md-6">

                                <label for="number_of_rooms" class="form-label">
                                    Number of Rooms <span class="required">*</span>
                                </label>

                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="fas fa-door-open"></i>
                                    </span>

                                    <input type="number"
                                           class="form-control"
                                           id="number_of_rooms"
                                           name="number_of_rooms"
                                           min="1"
                                           max="20"
                                           value="1"
                                           required>
                                </div>

                            </div>

                        </div>

                        <hr class="my-5">

                        <!-- Check-in / Check-out -->
                        <h5 class="mb-4">
                            <i class="fas fa-calendar-check orange-text me-2"></i>
                            Stay Details
                        </h5>

                        <div class="row g-4">

                            <!-- Check-in Date -->
                            <div class="col-md-6">

                                <label for="check_in_date" class="form-label">
                                    Check-in Date <span class="required">*</span>
                                </label>

                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="fas fa-calendar-day"></i>
                                    </span>

                                    <input type="date"
                                           class="form-control"
                                           id="check_in_date"
                                           name="check_in_date"
                                           required>
                                </div>

                            </div>

                            <!-- Check-in Time -->
                            <div class="col-md-6">

                                <label for="check_in_time" class="form-label">
                                    Check-in Time <span class="required">*</span>
                                </label>

                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="fas fa-clock"></i>
                                    </span>

                                    <input type="time"
                                           class="form-control"
                                           id="check_in_time"
                                           name="check_in_time"
                                           value="14:00"
                                           required>
                                </div>

                            </div>

                            <!-- Check-out Date -->
                            <div class="col-md-6">

                                <label for="check_out_date" class="form-label">
                                    Check-out Date <span class="required">*</span>
                                </label>

                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="fas fa-calendar-minus"></i>
                                    </span>

                                    <input type="date"
                                           class="form-control"
                                           id="check_out_date"
                                           name="check_out_date"
                                           required>
                                </div>

                            </div>

                            <!-- Check-out Time -->
                            <div class="col-md-6">

                                <label for="check_out_time" class="form-label">
                                    Check-out Time <span class="required">*</span>
                                </label>

                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="fas fa-clock"></i>
                                    </span>

                                    <input type="time"
                                           class="form-control"
                                           id="check_out_time"
                                           name="check_out_time"
                                           value="10:00"
                                           required>
                                </div>

                            </div>

                        </div>

                        <hr class="my-5">

                        <!-- Special Requests -->
                        <h5 class="mb-4">
                            <i class="fas fa-comment-dots orange-text me-2"></i>
                            Additional Information
                        </h5>

                        <div class="row g-4">

                            <div class="col-12">

                                <label for="special_requests" class="form-label">
                                    Special Requests
                                </label>

                                <textarea class="form-control"
                                          id="special_requests"
                                          name="special_requests"
                                          placeholder="Let us know if you have any special requests, preferences, or additional information..."></textarea>

                            </div>

                        </div>

                        <!-- Submit -->
                        <div class="text-center mt-5">

                            <button type="submit"
                                    id="booking-submit-btn"
                                    class="booking-btn">

                                <i class="fas fa-paper-plane me-2"></i>

                                <span id="button-text">
                                    Submit Booking Request
                                </span>

                            </button>

                        </div>

                        <!-- Status -->
                        <div id="form-status"></div>

                    </form>

                    <!-- Back -->
                    <div class="text-center mt-4">

                        <a href="index.html" class="back-btn">
                            <i class="fas fa-arrow-left me-2"></i>
                            Back to Website
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </section>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


    <!-- Booking Form Script -->
    <script>

        document.addEventListener("DOMContentLoaded", function () {

            const form = document.getElementById("booking-form");
            const submitButton = document.getElementById("booking-submit-btn");
            const buttonText = document.getElementById("button-text");
            const statusBox = document.getElementById("form-status");

            const checkInDate = document.getElementById("check_in_date");
            const checkOutDate = document.getElementById("check_out_date");


            /*
            ============================================
            SET TODAY AS MINIMUM CHECK-IN DATE
            ============================================
            */

            const today = new Date();

            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, "0");
            const day = String(today.getDate()).padStart(2, "0");

            const todayString = `${year}-${month}-${day}`;

            checkInDate.min = todayString;
            checkOutDate.min = todayString;


            /*
            ============================================
            UPDATE CHECKOUT MINIMUM DATE
            ============================================
            */

            checkInDate.addEventListener("change", function () {

                if (checkInDate.value) {

                    checkOutDate.min = checkInDate.value;

                    /*
                    If checkout date is earlier than check-in,
                    automatically clear it.
                    */

                    if (
                        checkOutDate.value &&
                        checkOutDate.value < checkInDate.value
                    ) {
                        checkOutDate.value = "";
                    }

                }

            });


            /*
            ============================================
            FORM SUBMISSION
            ============================================
            */

            form.addEventListener("submit", async function (event) {

                event.preventDefault();
                event.stopPropagation();


                /*
                Clear previous status
                */

                statusBox.className = "";
                statusBox.style.display = "none";
                statusBox.innerHTML = "";


                /*
                Validate checkout date
                */

                if (
                    checkInDate.value &&
                    checkOutDate.value &&
                    checkOutDate.value < checkInDate.value
                ) {

                    statusBox.className = "error";
                    statusBox.innerHTML =
                        '<i class="fas fa-circle-exclamation me-2"></i>' +
                        'Check-out date cannot be earlier than the check-in date.';

                    return;

                }


                /*
                Disable button
                */

                submitButton.disabled = true;

                buttonText.innerHTML =
                    '<i class="fas fa-spinner fa-spin me-2"></i> Sending...';


                /*
                Collect form data
                */

                const formData = new FormData(form);

                const data = {};

                formData.forEach((value, key) => {
                    data[key] = value;
                });


                /*
                Debug information
                */

                console.log("----------------------------------------");
                console.log("Aqua Platinums Booking Form");
                console.log("----------------------------------------");

                console.log("Submitting to:");
                console.log(form.action);

                console.log("Form data:");
                console.table(data);


                try {

                    /*
                    ============================================
                    SEND TO FORMSUBMIT
                    ============================================
                    */

                    const response = await fetch(
                        form.action,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type": "application/json",
                                "Accept": "application/json"
                            },

                            body: JSON.stringify(data)
                        }
                    );


                    /*
                    Get raw response first.
                    This makes debugging easier if FormSubmit
                    returns something other than JSON.
                    */

                    const responseText = await response.text();


                    console.log("HTTP Status:", response.status);
                    console.log("Raw FormSubmit Response:");
                    console.log(responseText);


                    /*
                    Try converting response to JSON
                    */

                    let result = {};

                    try {

                        result = JSON.parse(responseText);

                    } catch (jsonError) {

                        console.warn(
                            "FormSubmit response was not valid JSON."
                        );

                        result = {
                            message: responseText
                        };

                    }


                    console.log("Parsed FormSubmit Response:");
                    console.log(result);


                    /*
                    ============================================
                    CHECK RESPONSE
                    ============================================
                    */

                    if (
                        !response.ok ||
                        result.success === false
                    ) {

                        throw new Error(
                            result.message ||
                            "FormSubmit rejected the booking request."
                        );

                    }


                    /*
                    ============================================
                    SUCCESS
                    ============================================
                    */

                    statusBox.className = "success";

                    statusBox.innerHTML =
                        '<i class="fas fa-circle-check me-2"></i>' +
                        '<strong>Booking request sent successfully!</strong>' +
                        '<br>' +
                        '<span class="small">' +
                        'Thank you for your request. Our team will contact you shortly to confirm your reservation.' +
                        '</span>';

                    statusBox.style.display = "block";


                    /*
                    Reset form
                    */

                    form.reset();


                    /*
                    Restore default times
                    */

                    document.getElementById("check_in_time").value = "14:00";
                    document.getElementById("check_out_time").value = "10:00";

                    /*
                    Restore minimum dates
                    */

                    checkInDate.min = todayString;
                    checkOutDate.min = todayString;


                    console.log(
                        "Booking submitted successfully."
                    );


                } catch (error) {

                    /*
                    ============================================
                    ERROR
                    ============================================
                    */

                    console.error(
                        "Booking submission error:",
                        error
                    );


                    statusBox.className = "error";

                    statusBox.innerHTML =
                        '<i class="fas fa-circle-exclamation me-2"></i>' +
                        '<strong>Unable to send your booking request.</strong>' +
                        '<br>' +
                        '<span class="small">' +
                        'Please try again. If the problem continues, contact Aqua Platinums Lounge & Grill directly.' +
                        '</span>';


                    statusBox.style.display = "block";

                } finally {

                    /*
                    ============================================
                    RESTORE BUTTON
                    ============================================
                    */

                    submitButton.disabled = false;

                    buttonText.innerHTML =
                        '<i class="fas fa-paper-plane me-2"></i> Submit Booking Request';

                }

            });

        });

    </script>

</body>

</html>
